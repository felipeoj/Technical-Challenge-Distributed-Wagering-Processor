services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      # Host port 5433 avoids clashing with a PostgreSQL already running locally.
      - "5433:5432"
    volumes:
      # Creates the extra database used by the test suites.
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 20

  localstack:
    # Pinned community tag: newer images require a LocalStack account/auth token.
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    volumes:
      # Scripts in ready.d run once LocalStack is up.
      - ./scripts/create-queues.sh:/etc/localstack/init/ready.d/create-queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-events.fifo"]
      interval: 3s
      timeout: 5s
      retries: 30
